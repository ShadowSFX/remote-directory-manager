name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore RDMan.sln
      - name: Build
        run: dotnet build RDMan.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/RDMan.Core.Tests -c Release --no-build --logger "trx"
